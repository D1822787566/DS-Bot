<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MOSS Live · Bot 详情侧栏交互</title>
  <style>
    :root{color-scheme:light;--bg:#fbfbfc;--panel:#fff;--sidebar:#f6f6f7;--ink:#17181a;--muted:#777981;--soft:#f0f1f3;--line:#e4e5e8;--accent:#4d6bfe;--accent-soft:#eff3ff;--green:#2d8b6b;--danger:#bd4b52;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .preview{height:48px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;font-size:11px}.preview strong{font-size:12px}.preview span{color:var(--muted)}.state-switch{display:flex;gap:4px;margin-left:auto}.state-switch button{padding:6px 9px;border-radius:7px;color:var(--muted);font-size:10px}.state-switch button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .app{height:calc(100dvh - 48px);display:grid;grid-template-columns:266px minmax(0,1fr);overflow:hidden}.left{display:flex;flex-direction:column;padding:13px 11px;background:var(--sidebar);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;padding:7px 7px 14px}.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#e5e7eb;color:#4b5260;font-size:11px;font-weight:700}.brand b{font-size:14px}.tools{display:flex;gap:5px;margin-bottom:14px}.tools button{padding:7px 10px;border-radius:8px;color:var(--muted);font-size:11px}.tools button:hover,.bot:hover{background:#ececee}.bot-list-title{padding:0 8px 7px;color:#a0a1a7;font-size:10px}.bot{display:flex;align-items:center;gap:9px;width:100%;padding:9px 8px;border-radius:10px;text-align:left}.bot.active{background:#e4e5e7}.avatar{display:grid;place-items:center;flex:none;width:31px;height:31px;border-radius:50%;background:#d9dce5;color:#4c5672;font-size:11px;font-weight:600}.bot-copy{min-width:0;flex:1}.bot-copy b{display:block;font-size:12px;font-weight:600}.bot-copy small{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px}.tag{display:inline-flex;align-items:center;margin-top:5px;padding:2px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:9px}.state-dot{width:6px;height:6px;border-radius:50%;background:#b4b5ba}.state-dot.live{background:var(--green)}.left-foot{margin-top:auto;padding:13px 8px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.7}
    .workspace{display:flex;flex-direction:column;min-width:0;min-height:0}.chat-head{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #f0f0f1;background:#fff}.chat-title{display:flex;align-items:center;gap:9px}.chat-title .avatar{width:29px;height:29px}.chat-title b{display:block;font-size:14px}.chat-title small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.head-actions{display:flex;gap:5px}.head-actions button{padding:7px 9px;border-radius:8px;color:var(--muted);font-size:10px}.body{display:flex;min-height:0;flex:1}.conversation{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}.messages{min-height:0;flex:1;overflow:auto;padding:31px max(27px,calc((100% - 710px)/2)) 20px}.date{margin:0 0 26px;text-align:center;color:#a1a2a7;font-size:10px}.message{margin:0 0 24px}.user{display:flex;justify-content:flex-end}.bubble{max-width:82%;padding:10px 13px;border-radius:16px;background:#f0f0f2;font-size:12px;line-height:1.7}.author{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:11px;font-weight:600}.author .avatar{width:23px;height:23px;font-size:9px}.assistant{padding-left:30px;color:#38393d;font-size:12px;line-height:1.8}.composer-zone{padding:9px 25px 15px}.composer{max-width:710px;margin:auto;padding:10px 12px 8px;border:1px solid #dfdfe2;border-radius:19px;background:#fff;box-shadow:0 2px 8px #14141406}.placeholder{height:27px;color:#a1a2a7;font-size:11px}.composer-row{display:flex;justify-content:space-between;align-items:center}.composer-row span{color:#a1a2a7;font-size:10px}.composer-row button{width:28px;height:28px;border-radius:50%;color:#fff;background:#26272a;font-size:12px}
    .details{display:flex;flex:0 0 325px;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:#fff}.detail-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:7px;height:58px;padding:0 14px;border-bottom:1px solid var(--line)}.icon-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:14px}.icon-btn:hover{background:var(--soft)}.detail-content{min-height:0;overflow:auto;padding:20px 16px 24px}.detail-hero{text-align:center}.detail-hero .avatar{width:52px;height:52px;margin:auto;font-size:16px}.detail-hero h2{margin:12px 0 3px;font-size:16px}.detail-hero p{margin:0;color:#a0a1a7;font-size:10px}.detail-tabs{display:flex;gap:4px;margin:18px 0 16px;padding:3px;border-radius:8px;background:#f1f1f3}.detail-tabs button{flex:1;padding:7px 4px;border-radius:6px;color:var(--muted);font-size:10px;white-space:nowrap}.detail-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #1414140d}.section-label{margin:17px 0 7px;color:#9b9ca2;font-size:10px}.info-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f1f1f2;font-size:11px}.info-row small{color:var(--muted)}.moss-card{margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fbfbff}.moss-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.moss-card-head strong{font-size:12px}.moss-card-head small{color:var(--green);font-size:9px}.moss-card p{margin:8px 0 12px;color:var(--muted);font-size:10px;line-height:1.55}.moss-actions{display:flex;gap:7px}.soft-btn,.primary-btn,.danger-btn{padding:8px 10px;border-radius:8px;font-size:10px}.soft-btn{border:1px solid var(--line);background:#fff;color:var(--muted)}.primary-btn{background:var(--accent);color:#fff}.danger-btn{border:1px solid #efd8da;background:#fff4f4;color:var(--danger)}.soft-btn:hover{background:var(--soft)}.profile-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:9px}.settings-block{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fcfcff}.settings-block strong{display:block;font-size:11px}.settings-block p{margin:6px 0 10px;color:var(--muted);font-size:10px;line-height:1.5}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #f0f0f2;font-size:10px}.settings-row small{color:var(--muted)}
    .moss-panel{display:flex;flex-direction:column;height:100%;margin:0}.moss-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 0 14px;border-bottom:1px solid var(--line)}.moss-panel-head strong{font-size:13px}.moss-panel-head small{display:block;margin-top:4px;color:var(--muted);font-size:9px}.moss-status{padding:16px 0 12px;text-align:center}.moss-status .orb{width:58px;height:58px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dce6ff,#7692f8 55%,#4d6bfe);box-shadow:inset -7px -7px 15px #182c6820,0 5px 15px #4d6bfe22}.moss-status b{display:block;margin-top:12px;font-size:13px}.moss-status span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.dial-btn{display:block;width:100%;margin-top:10px;padding:11px;border-radius:9px;background:var(--accent);color:#fff;text-align:center;font-size:11px;font-weight:600}.dial-btn:hover{background:#3f5be2}.unbound-card{margin-top:14px;padding:13px;border:1px dashed #cfd3e4;border-radius:11px;background:#fafbff}.unbound-card strong{font-size:11px}.unbound-card p{margin:7px 0 11px;color:var(--muted);font-size:10px;line-height:1.5}
    .modal-backdrop{position:absolute;inset:0;display:grid;place-items:center;background:#1617222a;z-index:4}.modal{width:min(540px,calc(100% - 32px));max-height:calc(100% - 38px);overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 60px #15162226}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head strong{font-size:15px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:10px}.modal-body{padding:18px 20px}.form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:7px;color:var(--muted);font-size:10px}.input,.select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:11px}.voice-inline{display:flex;align-items:center;gap:8px}.voice-inline .select{flex:1}.field-note{display:block;margin-top:6px;color:var(--muted);font-size:9px}.check-row{display:flex;gap:8px;align-items:flex-start;margin:12px 0;color:#444;font-size:11px;line-height:1.45}.check-row input{margin-top:2px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}.step-note{padding:9px 10px;border-radius:8px;background:#f7f8ff;color:#59627c;font-size:10px;line-height:1.5}
    .dialing{padding:20px 0}.dialing .moss-status{padding-top:28px}.dialing .moss-status b{color:var(--accent)}.caption-mini{margin-top:15px;padding:12px;border-radius:10px;background:#f7f8ff;color:#4e5570;font-size:10px;line-height:1.55}
    @media(max-width:900px){.details{flex-basis:300px}.messages{padding-left:22px;padding-right:22px}}
    @media(max-width:720px){.preview{height:72px;flex-wrap:wrap;padding:8px 12px;gap:5px 9px}.state-switch{width:100%;margin-left:0}.state-switch button{flex:1}.app{height:calc(100dvh - 72px);grid-template-columns:58px minmax(0,1fr)}.left{padding:12px 5px}.brand{justify-content:center;padding:3px 0 15px}.brand b,.tools,.bot-list-title,.bot-copy,.left-foot{display:none}.bot{justify-content:center;padding:9px 0}.body{display:flex;flex-direction:column}.conversation{display:none}.details{display:flex;flex:1;border-left:0}.chat-head{height:60px;padding:0 14px}.head-actions{display:none}.messages{padding:22px 15px 12px}.composer-zone{padding:8px 12px 11px}.moss-panel{padding:0}.modal-backdrop{position:fixed}.modal{max-height:calc(100dvh - 34px)}}
  </style>
</head>
<body>
  <header class="preview"><strong>详情侧栏 · MOSS Live 入口</strong><span>当前 Bot：Chief · 交互状态原型</span><div class="state-switch"><button data-state="unbound" class="active">未绑定</button><button data-state="bound">已绑定</button><button data-state="modal">设置弹框</button><button data-state="dialing">拨打中</button></div></header>
  <div class="app">
    <aside class="left"><div class="brand"><span class="brand-mark">DS</span><b>DS Bot</b></div><div class="tools"><button>搜索</button><button>新建</button></div><div class="bot-list-title">Bot 列表</div><button class="bot active"><span class="avatar">首</span><span class="bot-copy"><b>Chief</b><small>主 Bot</small><span class="tag">MOSS 未绑定</span></span><i class="state-dot"></i></button><button class="bot"><span class="avatar">华</span><span class="bot-copy"><b>华子</b><small>已有长期聊天</small></span><i class="state-dot"></i></button><button class="bot"><span class="avatar">才</span><span class="bot-copy"><b>才子</b><small>已有长期聊天</small></span><i class="state-dot"></i></button><div class="left-foot">一个 Bot 对应一个 MOSS Profile。<br>入口在当前 Bot 详情侧栏。</div></aside>
    <main class="workspace"><header class="chat-head"><div class="chat-title"><span class="avatar">首</span><div><b>Chief</b><small>Chief of Staff</small></div></div><div class="head-actions"><button>查看详情</button></div></header><div class="body"><section class="conversation"><div class="messages"><p class="date">11 月 7 日周六 13:28</p><div class="message"><div class="author"><span class="avatar">首</span>Chief</div><div class="assistant">你好！我是 Chief，你的首席幕僚 Bot。<br><br>我会帮你打理整个 Bot 团队：安排任务、创建专员、协调协作。</div></div></div><div class="composer-zone"><div class="composer"><div class="placeholder">发消息或创建任务，/ 调用指令，@ 文件或对话</div><div class="composer-row"><span>+　语音输入</span><button>➤</button></div></div></div></section>
      <aside class="details" id="details"></aside>
    </div></main>
  </div>
  <script>
    const details=document.querySelector('#details'); const stateButtons=[...document.querySelectorAll('[data-state]')]; let current='unbound'; let detailTab='details';
    const modal=()=>`<div class="modal-backdrop" data-modal><section class="modal"><header class="modal-head"><div><strong>设置 MOSS Live</strong><p>配置当前 Bot 的 MOSS Profile；音色只对当前 Profile 生效。</p></div><button class="icon-btn" data-close-modal>×</button></header><div class="modal-body"><div class="step-note">当前 Bot：Chief。保存后会回到当前 Bot 的详情侧栏。拨打需要用户手动点击。</div><div class="form-group"><label>绑定 MOSS Profile</label><select class="select"><option>新建 Profile：Chief 语音入口</option><option>选择已有 Profile</option></select></div><div class="form-group"><label>Profile 名称</label><input class="input" value="Chief 语音入口"></div><div class="form-group"><label>Profile 音色</label><div class="voice-inline"><select class="select"><option>默认音色</option><option selected>温和女声 · 当前 Profile</option><option>清晰男声</option></select><button class="soft-btn" type="button" data-preview-voice>试听</button></div><small class="field-note">切换 Bot 后使用目标 Profile 的音色。</small></div><div class="form-group"><label>权限</label><label class="check-row"><input type="checkbox" checked>允许读取当前 Bot 私聊历史</label><label class="check-row"><input type="checkbox" checked>允许向当前 Bot 派发任务</label></div><div class="form-group"><label>MOSS API Key</label><input class="input" placeholder="已由 Host Secret Store 保管"></div></div><footer class="modal-foot"><button class="soft-btn" data-close-modal>取消</button><button class="primary-btn" data-save-modal>保存并返回侧栏</button></footer></section></div>`;
    function detailTabs(active){return `<div class="detail-tabs"><button data-detail-tab="details" class="${active==='details'?'active':''}">详情</button><button data-detail-tab="browser" class="${active==='browser'?'active':''}">浏览器</button><button data-detail-tab="moss" class="${active==='moss'?'active':''}">MOSS Live</button></div>`}
    function detailPanel(){return `<div class="detail-content"><div class="detail-hero"><span class="avatar">首</span><h2>Chief</h2><p>Chief of Staff</p></div>${detailTabs('details')}<div class="section-label">Bot 设置</div><div class="info-row"><span>模型</span><small>GLM-5.3-Flash</small></div><div class="info-row"><span>权限</span><small>工作区内修改</small></div><div class="info-row"><span>工作文件夹</span><small>总工作区</small></div><div class="info-row"><span>记忆</span><small>暂无保存内容</small></div></div>`}
    function mossSettingsPanel(){return `<div class="detail-content moss-panel"><header class="moss-panel-head"><div><strong>MOSS Live</strong><small>当前 Bot 的语音设置与 Profile</small></div><button class="icon-btn" data-open-modal title="打开 MOSS Live 设置弹框">⚙</button></header>${detailTabs('moss')}<div class="moss-status"><span class="orb"></span><b>未绑定 MOSS Profile</b><span>先完成绑定和设置，再手动拨打</span></div><div class="settings-block"><strong>绑定当前 Bot</strong><p>一个 Bot 只能绑定一个 MOSS Profile。保存后，MOSS Live 会固定服务当前 Bot。</p><div class="moss-actions"><button class="primary-btn" data-open-modal>绑定并设置</button><button class="soft-btn" data-open-modal>打开设置</button></div></div><div class="settings-block"><strong>公共设置</strong><div class="settings-row"><span>API Key</span><small>由 Host Secret Store 保管</small></div><div class="settings-row"><span>Profile 音色</span><small>绑定后独立设置</small></div><div class="settings-row"><span>通话方式</span><small>手动拨打</small></div></div></div>`}
    function boundPanel(){return `<div class="detail-content moss-panel"><header class="moss-panel-head"><div><strong>MOSS Live</strong><small>Chief · Chief 语音入口</small></div><button class="icon-btn" data-open-modal title="设置 MOSS Live">⚙</button></header>${detailTabs('moss')}<div class="moss-status"><span class="orb"></span><b>已绑定 · 未开始</b><span>点击“拨打”后才会申请麦克风并建立通话</span><button class="dial-btn" data-dial>拨打</button></div><div class="info-row"><span>Profile</span><small>Chief 语音入口</small></div><div class="info-row"><span>音色</span><small>温和女声 · 当前 Profile</small></div><div class="info-row"><span>字幕</span><small>用户 + MOSS</small></div><div class="info-row"><span>任务权限</span><small>已开启</small></div></div>`}
    function unboundPanel(){return detailPanel()}
    function dialingPanel(){return `<div class="detail-content moss-panel dialing"><header class="moss-panel-head"><div><strong>MOSS Live</strong><small>Chief · Chief 语音入口</small></div><button class="icon-btn" data-open-modal title="设置 MOSS Live">⚙</button></header>${detailTabs('moss')}<div class="moss-status"><span class="orb"></span><b>正在拨打</b><span>正在连接 MOSS Live…</span><button class="danger-btn" data-hangup>取消</button></div><div class="caption-mini"><b>连接成功后</b><br>右侧将显示实时字幕，用户和 MOSS 的内容会用颜色和标签区分。</div></div>`}
    function render(){
      const base=current==='unbound'?detailPanel():current==='bound'?detailPanel():current==='dialing'?detailPanel():detailPanel();
      const moss=current==='unbound'?mossSettingsPanel():current==='bound'?boundPanel():current==='dialing'?dialingPanel():mossSettingsPanel();
      details.innerHTML=detailTab==='moss'?moss:base;
      if(current==='modal') document.body.insertAdjacentHTML('beforeend',modal());
      bind();
    }
    function bind(){document.querySelectorAll('[data-detail-tab]').forEach(button=>button.onclick=()=>{detailTab=button.dataset.detailTab;render()});document.querySelectorAll('[data-open-modal]').forEach(button=>button.onclick=()=>{document.querySelector('[data-modal]')?.remove();document.body.insertAdjacentHTML('beforeend',modal());bind()});document.querySelectorAll('[data-close-modal]').forEach(button=>button.onclick=()=>{document.querySelector('[data-modal]')?.remove();if(current==='modal'){current='unbound';detailTab='details';setActive('unbound');render()}});document.querySelector('[data-preview-voice]')?.addEventListener('click',event=>{event.currentTarget.textContent=event.currentTarget.textContent==='试听'?'播放中…':'试听'});document.querySelector('[data-save-modal]')?.addEventListener('click',()=>{document.querySelector('[data-modal]')?.remove();current='bound';detailTab='moss';setActive('bound');render()});document.querySelector('[data-dial]')?.addEventListener('click',()=>{current='dialing';detailTab='moss';setActive('dialing');render()});document.querySelector('[data-hangup]')?.addEventListener('click',()=>{current='bound';detailTab='moss';setActive('bound');render()})}
    function setActive(name){stateButtons.forEach(button=>button.classList.toggle('active',button.dataset.state===name))}
    stateButtons.forEach(button=>button.onclick=()=>{current=button.dataset.state;detailTab=current==='unbound'?'details':'moss';setActive(current);document.querySelector('[data-modal]')?.remove();render()});render();
  </script>
</body>
</html>
